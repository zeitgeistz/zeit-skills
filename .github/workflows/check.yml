name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifests, skill frontmatter and references
        run: node scripts/check.mjs
