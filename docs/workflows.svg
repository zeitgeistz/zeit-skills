<svg xmlns="http://www.w3.org/2000/svg" width="960" height="338" viewBox="0 0 960 338" role="img" aria-labelledby="title desc">
  <title id="title">Test, diagnose, review and commit</title>
  <desc id="desc">Run /zeit:test. If checks fail, run /zeit:debug, confirm and fix the cause, then rerun tests. If checks pass, run /zeit:review, then stage changes and use /zeit:commit for a local commit.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m2 1 4 3-4 3" fill="none" stroke="#CBEA91" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="337" rx="16" fill="#101416" stroke="#34403E"/>
  <rect x="32" y="118" width="248" height="100" rx="10" fill="#191F20" stroke="#34403E"/>
  <text x="50" y="145" fill="#CBEA91" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">RUN PROJECT CHECKS</text>
  <text x="50" y="177" fill="#F4F0E7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">/zeit:test</text>
  <text x="50" y="201" fill="#AEBAB2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Tests, lint, types, build</text>
  <path d="M280 168h53V90h74m-74 78v80h74" fill="none" stroke="#CBEA91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="333" cy="168" r="3" fill="#CBEA91"/>
  <path d="M397 90h11" fill="none" stroke="#CBEA91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M397 248h11" fill="none" stroke="#CBEA91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="414" y="41" width="248" height="100" rx="10" fill="#252D22" stroke="#34403E"/>
  <text x="432" y="68" fill="#CBEA91" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">CHECKS PASS</text>
  <text x="432" y="99" fill="#F4F0E7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">/zeit:review</text>
  <text x="432" y="123" fill="#AEBAB2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Review the diff</text>
  <rect x="414" y="198" width="248" height="100" rx="10" fill="#191F20" stroke="#34403E"/>
  <text x="432" y="225" fill="#CBEA91" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">CHECKS FAIL</text>
  <text x="432" y="256" fill="#F4F0E7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">/zeit:debug</text>
  <text x="432" y="280" fill="#AEBAB2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Confirm the cause, then fix it</text>
  <path d="M669 90h38" fill="none" stroke="#CBEA91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="714" y="41" width="214" height="100" rx="10" fill="#252D22" stroke="#34403E"/>
  <text x="732" y="68" fill="#CBEA91" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">STAGE YOUR CHANGES</text>
  <text x="732" y="99" fill="#F4F0E7" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">/zeit:commit</text>
  <text x="732" y="123" fill="#AEBAB2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Create a local commit</text>
  <path d="M414 270H156v-46" fill="none" stroke="#CBEA91" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="185" y="291" fill="#AEBAB2" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400">Rerun checks after the fix</text>
</svg>
