<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">How a zeit command runs</title>
  <desc id="d">Five steps from typing a command to a report. Below, three outcomes: say fix to change files, say save to write a doc, or give no reply and nothing changes. Rules: report first; act only on a word.</desc>
  <rect width="960" height="340" rx="18" fill="#0f172a"/>
  <text x="40" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">How a command runs</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#1e293b" stroke="#334155">
      <rect x="40" y="75" width="150" height="70" rx="10"/>
      <rect x="230" y="75" width="150" height="70" rx="10"/>
      <rect x="420" y="75" width="150" height="70" rx="10"/>
      <rect x="610" y="75" width="150" height="70" rx="10"/>
      <rect x="800" y="75" width="150" height="70" rx="10"/>
    </g>
    <g font-size="15" fill="#e2e8f0">
      <text x="115" y="104">You type</text><text x="115" y="126" font-family="Consolas, Menlo, monospace" fill="#7dd3fc">/zeit:name</text>
      <text x="305" y="104">SKILL.md</text><text x="305" y="126">instructions load</text>
      <text x="495" y="104">Read project</text><text x="495" y="126">files and config</text>
      <text x="685" y="104">Run the project's</text><text x="685" y="126">own tools</text>
      <text x="875" y="104">Report findings</text><text x="875" y="126">ranked, file:line</text>
    </g>
    <g fill="#1e293b" stroke="#334155">
      <rect x="50" y="240" width="240" height="62" rx="10"/>
      <rect x="360" y="240" width="240" height="62" rx="10"/>
      <rect x="670" y="240" width="240" height="62" rx="10"/>
    </g>
    <g font-size="15" fill="#e2e8f0">
      <text x="170" y="265" font-family="Consolas, Menlo, monospace" fill="#7dd3fc">"fix 1"</text><text x="170" y="287">small change, then checks</text>
      <text x="480" y="265" font-family="Consolas, Menlo, monospace" fill="#7dd3fc">"save"</text><text x="480" y="287">write a doc to the repo</text>
      <text x="790" y="265">no reply</text><text x="790" y="287">stop, nothing changed</text>
    </g>
  </g>
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M190 110 H222"/><path d="M380 110 H412"/><path d="M570 110 H602"/><path d="M760 110 H792"/>
    <path d="M875 145 V190 H170 V236"/><path d="M480 190 V236"/><path d="M790 190 V236"/>
  </g>
  <g fill="#38bdf8">
    <polygon points="222,105 230,110 222,115"/><polygon points="412,105 420,110 412,115"/>
    <polygon points="602,105 610,110 602,115"/><polygon points="792,105 800,110 792,115"/>
  </g>
  <text x="480" y="326" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Rule 1: report first. Rule 2: act only on a word.</text>
</svg>
