<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="t d">
  <title id="t">zeit commands and what each one changes</title>
  <desc id="d">Fifteen commands in six groups. Each marker shows whether the command only reports, changes files after a word, edits files when run, or only makes local git commits or tags.</desc>
  <rect width="960" height="580" rx="18" fill="#0f172a"/>
  <text x="30" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Commands and what they change</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    <rect x="30" y="70" width="430" height="162" rx="12" fill="#1e293b"/><text x="50" y="98">Check</text>
    <rect x="30" y="250" width="430" height="106" rx="12" fill="#1e293b"/><text x="50" y="278">Security</text>
    <rect x="30" y="374" width="430" height="134" rx="12" fill="#1e293b"/><text x="50" y="402">Improve</text>
    <rect x="500" y="70" width="430" height="106" rx="12" fill="#1e293b"/><text x="520" y="98">Understand and document</text>
    <rect x="500" y="194" width="430" height="134" rx="12" fill="#1e293b"/><text x="520" y="222">Debug and ship</text>
    <rect x="500" y="346" width="430" height="78" rx="12" fill="#1e293b"/><text x="520" y="374">Other</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#7dd3fc">
    <text x="60" y="126">/zeit:test</text><text x="60" y="154">/zeit:review</text><text x="60" y="182">/zeit:code-check</text><text x="60" y="210">/zeit:perf</text>
    <text x="60" y="306">/zeit:security</text><text x="60" y="334">/zeit:threats</text>
    <text x="60" y="430">/zeit:improve</text><text x="60" y="458">/zeit:design-check</text><text x="60" y="486">/zeit:deps</text>
    <text x="530" y="126">/zeit:architecture</text><text x="530" y="154">/zeit:docs</text>
    <text x="530" y="250">/zeit:debug</text><text x="530" y="278">/zeit:commit</text><text x="530" y="306">/zeit:release</text>
    <text x="530" y="402">/zeit:focus</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    <text x="250" y="126">reports only</text><text x="250" y="154">reports only</text><text x="250" y="182">reports only</text><text x="250" y="210">reports only</text>
    <text x="250" y="306">after save or fix</text><text x="250" y="334">after save or fix</text>
    <text x="250" y="430">edits on run</text><text x="250" y="458">after fix</text><text x="250" y="486">after upgrade safe</text>
    <text x="720" y="126">after write</text><text x="720" y="154">docs only, after fix</text>
    <text x="720" y="250">after fix</text><text x="720" y="278">local commit</text><text x="720" y="306">local commit + tag</text>
    <text x="720" y="402">no files</text>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <circle cx="40" cy="122" r="6"/><circle cx="40" cy="150" r="6"/><circle cx="40" cy="178" r="6"/><circle cx="40" cy="206" r="6"/>
    <circle cx="510" cy="398" r="6"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="40" cy="302" r="6"/><circle cx="40" cy="330" r="6"/><circle cx="40" cy="454" r="6"/><circle cx="40" cy="482" r="6"/>
    <circle cx="510" cy="122" r="6"/><circle cx="510" cy="150" r="6"/><circle cx="510" cy="246" r="6"/>
  </g>
  <polygon points="40,419 47,432 33,432" fill="#f59e0b"/>
  <polygon points="510,268 516,274 510,280 504,274" fill="#a78bfa"/>
  <polygon points="510,296 516,302 510,308 504,302" fill="#a78bfa"/>
  <rect x="500" y="440" width="430" height="130" rx="12" fill="#1e293b"/>
  <text x="520" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Legend</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <circle cx="520" cy="490" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="538" y="495">reports only</text>
    <circle cx="520" cy="512" r="6" fill="#38bdf8"/><text x="538" y="517">changes after a word</text>
    <polygon points="520,527 527,540 513,540" fill="#f59e0b"/><text x="538" y="539">edits files when run</text>
    <polygon points="520,548 526,554 520,560 514,554" fill="#a78bfa"/><text x="538" y="559">local git only, never pushes</text>
  </g>
</svg>
